<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能销售Agent</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f0f2f5;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}.grade-A{background:#d4edda;color:#155724}.grade-B{background:#fff3cd;color:#856404}.grade-C{background:#f8d7da;color:#721c24}</style>
</head>
<body>
<nav class="navbar navbar-dark" style="background:#1a365d">
  <div class="container"><span class="navbar-brand">智能销售Agent</span>
  <a href="/dashboard" class="btn btn-sm btn-outline-light">ROI Dashboard</a></div>
</nav>
<div class="container mt-4">
  <div class="row">
    <div class="col-md-4">
      <div class="card mb-3"><div class="card-header bg-primary text-white">新线索录入</div>
        <div class="card-body">
          <div class="mb-2"><input id="companyName" class="form-control" placeholder="公司名称"></div>
          <div class="mb-2"><input id="contactName" class="form-control" placeholder="联系人（可选）"></div>
          <button class="btn btn-primary w-100" onclick="addLead()">富集+评分+生成邮件</button>
        </div>
      </div>
      <div class="card"><div class="card-header bg-info text-white">线索列表</div>
        <div class="card-body p-0" style="max-height:400px;overflow-y:auto">
          <table class="table table-sm mb-0"><thead><tr><th>公司</th><th>评分</th><th>等级</th></tr></thead>
          <tbody id="leadList"></tbody></table>
        </div>
      </div>
    </div>
    <div class="col-md-8">
      <div class="card mb-3"><div class="card-header bg-success text-white">线索详情 & 邮件中心</div>
        <div class="card-body" id="leadDetail"><p class="text-muted">点击左侧线索查看详情</p></div>
      </div>
      <div class="card"><div class="card-header bg-warning text-dark">模拟客户回复</div>
        <div class="card-body">
          <div class="input-group">
            <input id="replyText" class="form-control" placeholder="输入客户回复内容...">
            <button class="btn btn-warning" onclick="sendReply()">处理回复</button>
          </div>
          <div class="mt-2">
            <button class="btn btn-sm btn-outline-success me-1" onclick="setReply('我很感兴趣，可以聊聊价格')">感兴趣</button>
            <button class="btn btn-sm btn-outline-danger me-1" onclick="setReply('不需要，谢谢')">拒绝</button>
            <button class="btn btn-sm btn-outline-secondary me-1" onclick="setReply('我考虑一下')">待定</button>
            <button class="btn btn-sm btn-outline-info" onclick="setReply('你们的产品价格是多少？')">问问题</button>
          </div>
          <div id="replyResult" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
let currentLeadId=null;
function addLead(){axios.post('/api/lead/new',{company_name:companyName.value,contact_name:contactName.value}).then(r=>{loadLeads();showLead(r.data.lead_id);companyName.value='';contactName.value='';});}
function loadLeads(){axios.get('/api/leads').then(r=>{leadList.innerHTML=r.data.leads.map(l=>'<tr style="cursor:pointer" onclick="showLead(\''+l.id+'\')"><td>'+l.company_name+'</td><td>'+l.score+'</td><td><span class="badge grade-'+l.grade+'">'+l.grade+'</span></td></tr>').join('');});}
function showLead(id){currentLeadId=id;axios.get('/api/lead/'+id).then(r=>{const d=r.data;const s=d.state||{};const l=s.lead||{};let html='<h6>'+(l.company_name||id)+'</h6>';html+='<p><small>行业:'+(l.industry||'-')+' 规模:'+(l.company_size||'-')+' 融资:'+(l.funding_stage||'-')+'</small></p>';if(s.score)html+='<p>评分: '+s.score.total_score+'分 <span class="badge grade-'+s.score.grade+'">'+s.score.grade+'级</span></p>';html+='<hr><h6>沟通记录</h6>';html+=(d.communications||[]).map(c=>'<div class="mb-2 p-2 '+(c.direction==='outbound'?'bg-light':'bg-info bg-opacity-10')+' rounded"><small><b>'+(c.direction==='outbound'?'发送':'接收')+'</b> '+c.subject+'</small><br><small>'+(c.body||'').substring(0,100)+'...</small></div>').join('');html+='<button class="btn btn-sm btn-outline-primary mt-2" onclick="followup()">发送跟进邮件</button>';leadDetail.innerHTML=html;});}
function followup(){axios.post('/api/lead/followup/'+currentLeadId).then(r=>{alert('已发送第'+r.data.step+'封跟进邮件，角度:'+r.data.angle);showLead(currentLeadId);});}
function setReply(t){replyText.value=t;}
function sendReply(){axios.post('/api/lead/reply',{lead_id:currentLeadId,reply_text:replyText.value}).then(r=>{const c=r.data.classification;let html='<div class="alert alert-info">回复类型: <b>'+c.reply_label+'</b> (置信度:'+c.confidence+')</div>';html+='<p><b>自动响应:</b>'+c.auto_response.substring(0,150)+'...</p>';if(r.data.recommended_slots){html+='<p><b>推荐会议时间:</b></p>';r.data.recommended_slots.forEach(s=>{html+='<button class="btn btn-sm btn-outline-success me-1 mb-1" onclick="bookMeeting(\''+s.slot_id+'\')">'+s.date+' '+s.time+'</button>';});}replyResult.innerHTML=html;showLead(currentLeadId);});}
function bookMeeting(slot){axios.post('/api/lead/meeting',{lead_id:currentLeadId,slot_id:slot}).then(r=>{alert('会议已预约: '+r.data.scheduled_time);showLead(currentLeadId);});}
loadLeads();
</script>
</body>
</html>
